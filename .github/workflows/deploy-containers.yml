name: Promote production containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to promote
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: production-containers
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on:
      group: vaultspec-a2a-production
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      A2A_DEPLOY_ROOT: ${{ vars.A2A_DEPLOY_ROOT }}
      A2A_DEPLOY_ENV_FILE: ${{ vars.A2A_DEPLOY_ENV_FILE }}
      A2A_COMPOSE_PROJECT: ${{ vars.A2A_COMPOSE_PROJECT }}
      A2A_DEPLOY_COMPOSE_OVERRIDE: ${{ vars.A2A_DEPLOY_COMPOSE_OVERRIDE }}
    steps:
      - name: Checkout trusted promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Verify and promote release digests
        run: just deploy-containers
