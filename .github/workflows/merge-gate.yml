name: Merge Gate

# The pull-request critical path is intentionally Linux-only and delegates its
# complete contract to `just ci-merge`. Full artifact, desktop, provider, and
# native service certification with development fixtures runs after merge in test.yml.
#
# ONLY TRUSTED AUTHORS REACH THE FLEET. A pull request starts a job here only
# when it comes from a branch of this repository and its author is the owner, a
# collaborator, or the release App that opens the release pull request. Forks,
# outside contributors, Dependabot and every other bot run nothing on the
# self-hosted fleet; a collaborator who has read such a change re-opens it from
# a branch of this repository. A fork's pull request runs the fork's own copy of
# this file, so for forks these conditions only back up the repository's
# requirement that an outside contributor's runs be approved; for every other
# author they are the control itself. `ci:full`, applied by a user and never by
# a bot, asks for one more full run of a trusted pull request.
#
# `Check: Merge gate (Linux)` is the sole required status check, and a required
# check whose job is skipped counts as PASSED. The verdict job therefore carries
# the trust rule in its name as well as its condition: for an untrusted pull
# request it is skipped under another name, the required check stays expected,
# and the commit cannot merge. For a trusted pull request it runs on every
# event, and a label that starts nothing still reaches a verdict by finding this
# check's own earlier success on the same commit.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read

# One group per pull request AND per trigger. Adding an unrelated label must not
# cancel a run in flight, and a new push must supersede the push before it.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  basic:
    name: "Check: Basic CI (Linux)"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]') &&
      (github.event.action != 'labeled' || (github.event.label.name == 'ci:full' && github.event.sender.type == 'User'))
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 60
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
          cache: ''

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init-full

      - name: Run the merge profile
        run: just ci-merge

  gate:
    name: >-
      ${{ (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]')) && 'Check: Merge gate (Linux)' || 'Admission withheld (Linux)' }}
    needs: [basic]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR' || github.event.pull_request.user.login == 'nevenincs-release[bot]')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 125
    permissions:
      contents: read
      checks: read
      pull-requests: write
    env:
      CI_RESOURCE_CLASS: verdict
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASIC: ${{ needs.basic.result }}
    steps:
      # The label asks for ONE full run, so it is released as soon as that run
      # starts judging. A label another run already removed is not an error.
      - name: Release the ci:full label
        if: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:full' }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/ci:full" --silent || true

      - name: Judge the required checks
        run: |
          set -euo pipefail
          if [ "$BASIC" = "success" ]; then
            echo "Every required Linux check passed"
            exit 0
          fi
          if [ "$BASIC" != "skipped" ]; then
            echo "::error::Check: Basic CI (Linux) ended '$BASIC'"
            exit 1
          fi
          # Nothing ran in this run, so the verdict must already exist on this
          # commit - as it does when an unrelated label opened this run.
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=Check:%20Merge%20gate%20(Linux)&filter=all&per_page=100" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -gt 0 ]; then
            echo "Check: Basic CI (Linux) already passed on $HEAD_SHA"
            exit 0
          fi
          echo "::error::Check: Basic CI (Linux) has not run on $HEAD_SHA; push a commit or apply the ci:full label"
          exit 1
