name: Merge Gate

# The pull-request critical path is intentionally Linux-only and delegates its
# complete contract to `just ci-merge`. Full artifact, desktop, provider, and
# Compose certification runs after merge in test.yml.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  basic:
    name: "Check: Basic CI (Linux)"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init-full

      - name: Run the merge profile
        run: just ci-merge

  gate:
    name: "Check: Merge gate (Linux)"
    needs: [basic]
    if: always()
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Judge the required checks
        env:
          BASIC: ${{ needs.basic.result }}
        run: |
          if [ "$BASIC" != "success" ]; then
            echo "::error::Check: Basic CI (Linux) ended '$BASIC'"
            exit 1
          fi
          echo "Every required Linux check passed"
