name: Migration Check

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked migration environment
        run: uv sync --locked --no-default-groups --extra server --group tooling

      - name: Exercise migration round trip
        run: |
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic upgrade head
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic downgrade base
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic upgrade head
