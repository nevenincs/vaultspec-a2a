name: Migration Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `false` on purpose, and it is not a de-optimisation. These runners
          # are self-hosted and persistent, and each one pins UV_CACHE_DIR at a
          # cache shared by every runner on its host - so the cache is already
          # warm before the job starts and survives after it ends. `true` adds a
          # GitHub-cache round trip on top of that, and its post step then tries
          # to upload the whole shared directory: measured on this branch, the
          # `Post Set up uv` step ran for 18 minutes and was still going when it
          # hit the job's 20-minute budget, cancelling a run whose actual work
          # had finished in 81 seconds. Every sibling repo on this fleet already
          # calls setup-uv without it.
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # alembic.ini ships sqlalchemy.url empty so that a bare run cannot migrate
      # a database nobody named, so the round trip supplies its own throwaway
      # store. All three commands must address the SAME file for the downgrade
      # to have anything to undo, which rules out an in-memory URL: each command
      # is a separate process and would get its own empty database.
      - name: Exercise migration round trip
        env:
          MIGRATION_URL: sqlite+aiosqlite:///${{ runner.temp }}/migration-round-trip.db
        run: |
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" upgrade head
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" downgrade base
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" upgrade head
