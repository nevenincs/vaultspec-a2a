name: Migration Check

#
# ONLY TRUSTED AUTHORS REACH THE FLEET. This job checks out a pull request's own
# tree and runs its migrations on a self-hosted runner, so it runs for a pull
# request only when the author is the owner or a collaborator, or once a user -
# never a bot - has applied `ci:full`. A fork's pull request runs the fork's own
# copy of this file, so the fork clause only backs up the repository's approval
# requirement for outside contributors; for every other author the author clause
# is the control itself. Nothing here is a required check, so a skip is the
# intended outcome rather than a verdict to be recovered.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.action != 'labeled' && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR')) || (github.event.action == 'labeled' && github.event.label.name == 'ci:full' && github.event.sender.type == 'User'))) }}
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 20
    timeout-minutes: 140
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # alembic.ini ships sqlalchemy.url empty so that a bare run cannot migrate
      # a database nobody named, so the round trip supplies its own throwaway
      # store. All three commands must address the SAME file for the downgrade
      # to have anything to undo, which rules out an in-memory URL: each command
      # is a separate process and would get its own empty database.
      - name: Exercise migration round trip
        env:
          MIGRATION_URL: sqlite+aiosqlite:///${{ runner.temp }}/migration-round-trip.db
        run: |
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" upgrade head
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" downgrade base
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" upgrade head
