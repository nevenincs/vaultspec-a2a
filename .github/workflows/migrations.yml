name: Migration Check

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked migration environment
        run: uv sync --locked --no-default-groups --extra server --group tooling

      # alembic.ini ships sqlalchemy.url empty so that a bare run cannot migrate
      # a database nobody named, so the round trip supplies its own throwaway
      # store. All three commands must address the SAME file for the downgrade
      # to have anything to undo, which rules out an in-memory URL: each command
      # is a separate process and would get its own empty database.
      - name: Exercise migration round trip
        env:
          MIGRATION_URL: sqlite+aiosqlite:///${{ runner.temp }}/migration-round-trip.db
        run: |
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" upgrade head
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" downgrade base
          uv run --no-sync --frozen --no-default-groups --extra server --group tooling alembic -x sqlalchemy_url="$MIGRATION_URL" upgrade head
