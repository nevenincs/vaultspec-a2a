name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: "Build: Release proposal (Linux)"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The default token does not trigger pull_request workflows. Dispatch the
      # repository's real merge gate after release-please has updated its branch.
      - name: Dispatch the merge gate for the release pull request
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        run: gh workflow run merge-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH" -f "ref=$HEAD_BRANCH"

      # Resolve the workflow from main so release-policy repairs apply to old
      # tags, while release.yml checks out and proves the immutable tag itself.
      - name: Dispatch the release workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "operation=publish" -f "tag=$TAG"
