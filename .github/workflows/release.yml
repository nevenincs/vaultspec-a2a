# Publish the frozen runtime as a consumable artifact, per target.
#
# WHY THIS EXISTS. Consumers of this project need a binary they can download,
# start, stop, and call — not a source tree and a recipe. Until now the only way
# to obtain a runtime was to check this repository out at a pinned commit and run
# its PyInstaller spec on your own machines, which made every consumer a builder
# and made the pin a permanent coupling. This workflow ends that: it produces a
# downloadable archive per target, so a consumer needs a version number and
# nothing else.
#
# THE ARTIFACT CONTRACT — the naming is load-bearing, not cosmetic. A consumer
# has to construct these names before the release exists, so they must be
# derivable from (version, target) alone:
#
#   vaultspec-a2a-<version>-x86_64-unknown-linux-gnu.tar.gz   + .sha256
#   vaultspec-a2a-<version>-aarch64-unknown-linux-gnu.tar.gz  + .sha256
#   vaultspec-a2a-<version>-aarch64-apple-darwin.tar.gz       + .sha256
#   vaultspec-a2a-<version>-x86_64-pc-windows-msvc.zip        + .sha256
#
#   <version>  the release tag with its leading `v` removed (v0.2.0 -> 0.2.0)
#   contents   the PyInstaller ONEDIR directory, so extraction yields
#              vaultspec-a2a/vaultspec-a2a  (vaultspec-a2a\vaultspec-a2a.exe on Windows)
#   sidecar    <archive>.sha256, one line, bare lowercase hex, no filename column
#
# The target segment uses Rust target triples even though this is a Python
# project. That is deliberate: the consuming pipeline already keys its support
# matrix and its composition steps on exactly these four strings, so borrowing
# its vocabulary means no translation table sits between producer and consumer.
#
# EVERY TARGET IS BUILT NATIVELY. PyInstaller freezes for the architecture it
# runs on and has no cross-compilation flag, so a target built elsewhere would
# ship the wrong interpreter inside a correctly-named archive — which composes
# cleanly, verifies cleanly, and fails only on a user's machine. All four
# runners below are GitHub-hosted and native, including `ubuntu-24.04-arm`.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Freeze ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Install Python
        run: uv python install 3.13

      # Resolve a host interpreter ONCE, by name, and fail loudly if there is
      # none. The steps below parse JSON with it, and `python3` is not a reliable
      # name on the Windows runner's bash — a bare `python3` there would fail
      # mid-script with "command not found" rather than saying what was missing.
      - name: Resolve a host Python for the release scripts
        shell: bash
        run: |
          set -euo pipefail
          for candidate in python3 python; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "PY=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate: $("$candidate" --version)"
              exit 0
            fi
          done
          echo "::error::neither python3 nor python is on PATH; the release scripts cannot parse JSON" >&2
          exit 1

      # The archive name must match the code inside it. A tag and a
      # `[project] version` that disagree would publish an archive whose name
      # promises one version and whose binary reports another — refuse rather
      # than pick a winner.
      - name: Resolve and agree the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.tag || github.ref_name }}"
          tag_version="${raw#v}"
          project_version="$($PY -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=${tag_version} pyproject=${project_version}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error::tag version '${tag_version}' does not match pyproject [project] version '${project_version}'; the archive name would contradict the binary it contains" >&2
            exit 1
          fi
          echo "value=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Refuse to freeze for an architecture this runner is not
        # PyInstaller bundles the interpreter it is RUNNING on. The matrix above
        # already pairs each target with a native runner; this proves the pairing
        # held rather than assuming it, because a mislabelled archive is caught by
        # nothing downstream — the bytes are internally consistent and only the
        # name lies.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-*) want=arm64 ;;
            x86_64-*)  want=x64 ;;
            *) echo "::error::unhandled target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            aarch64|arm64) have=arm64 ;;
            x86_64|amd64)  have=x64 ;;
            *) echo "::error::unrecognised machine $(uname -m) for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          if [ "$want" != "$have" ]; then
            echo "::error::${{ matrix.target }} needs a $want runner; this one is $have. The frozen runtime cannot be cross-compiled." >&2
            exit 1
          fi
          echo "runner architecture $have matches ${{ matrix.target }}"

      - name: Install the locked freeze environment
        run: uv sync --locked --no-default-groups --group freeze

      - name: Freeze the runtime
        shell: bash
        run: uv run --no-sync --frozen python scripts/build_binary.py --dist dist/binary

      # THE GATE THAT MATTERS. The build script's own smoke proves the frozen
      # dispatch surface parses — `--version`, `--help`, and a run-module refusal
      # — but it never boots anything, so it cannot prove the artifact is USABLE.
      # A consumer's requirement is "start it, call its API, stop it", and that is
      # what is asserted here against the real frozen binary.
      #
      # Two details this gate is deliberate about:
      #   * `--port` is passed explicitly. The default (18000) is FIXED, not
      #     ephemeral, so relying on it would make two concurrent jobs on one
      #     machine collide silently.
      #   * The pid is checked directly after `stop`. A clean exit from a stop
      #     verb proves the verb returned, not that the process tree died.
      - name: Prove the artifact starts, serves, and stops
        shell: bash
        timeout-minutes: 6
        env:
          SMOKE_PORT: "18873"
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *windows*) bin="dist/binary/vaultspec-a2a/vaultspec-a2a.exe" ;;
            *)         bin="dist/binary/vaultspec-a2a/vaultspec-a2a" ;;
          esac
          test -x "$bin" || { echo "::error::frozen binary absent or not executable at $bin" >&2; exit 1; }
          home="${RUNNER_TEMP}/a2a-smoke-home"
          mkdir -p "$home"

          echo "--- setup (local only; provisions the home and runs bundled migrations)"
          "$bin" setup --app-home "$home"

          echo "--- start (blocks until discoverably healthy, emits ServiceStatus)"
          "$bin" start --app-home "$home" --host 127.0.0.1 --port "${SMOKE_PORT}" > start.json
          cat start.json
          read -r state healthy pid base <<EOF
          $($PY -c 'import json;d=json.load(open("start.json"));print(d["state"],d["healthy"],d["pid"],d["base_url"])')
          EOF
          echo "state=$state healthy=$healthy pid=$pid base=$base"
          [ "$state" = "running" ] || { echo "::error::start reported state '$state', expected 'running'" >&2; exit 1; }
          [ "$healthy" = "True" ] || { echo "::error::start reported healthy='$healthy'" >&2; exit 1; }
          case "$pid" in ''|None|0) echo "::error::start reported no pid" >&2; exit 1 ;; esac

          echo "--- status must exit 0 while the gateway is running"
          "$bin" status --app-home "$home"

          echo "--- USE THE API: /health must answer 200 AND report ready"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS -o health.json "$base/health" 2>/dev/null; then ok=yes; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::/health never answered at $base within 60s" >&2; exit 1; }
          cat health.json
          # 200 alone is not readiness: this endpoint answers 200 while `ready`
          # is false (for example with the worker down), so assert the field.
          "$PY" -c '
          import json,sys
          d=json.load(open("health.json"))
          if d.get("status")!="ok" or d.get("ready") is not True:
              sys.exit(f"/health answered but is not ready: {d}")
          print("health ok and ready")'

          echo "--- stop"
          "$bin" stop --app-home "$home"

          echo "--- status must now exit non-zero (gateway stopped)"
          if "$bin" status --app-home "$home"; then
            echo "::error::status exited 0 after stop; the gateway is still resident" >&2
            exit 1
          fi

          echo "--- and the process must actually be gone, not merely reported stopped"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            if tasklist //FI "PID eq ${pid}" 2>/dev/null | grep -q "${pid}"; then
              echo "::error::pid ${pid} is still alive after stop" >&2; exit 1
            fi
          elif kill -0 "${pid}" 2>/dev/null; then
            echo "::error::pid ${pid} is still alive after stop" >&2; exit 1
          fi
          echo "lifecycle smoke OK: started, served /health, stopped, pid reaped"

      - name: Archive the onedir
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          name="vaultspec-a2a-${version}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive="${name}.zip"
            ( cd dist/binary && 7z a -tzip -bso0 "../../${archive}" vaultspec-a2a >/dev/null )
          else
            archive="${name}.tar.gz"
            tar -czf "${archive}" -C dist/binary vaultspec-a2a
          fi
          # Bare lowercase digest, no filename column: the consumer compares it
          # against its own computed digest, and a second field would have to be
          # stripped by every reader.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" | cut -d' ' -f1 > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" | cut -d' ' -f1 > "${archive}.sha256"
          fi
          echo "${archive}: $(cat "${archive}.sha256")"
          echo "name=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload the built member
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.name }}
            ${{ steps.archive.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect every built member
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: members
          merge-multiple: true

      # The cohort is all four or none. Uploading a partial set would publish a
      # release that looks complete to anyone who only checks their own platform,
      # and the missing target would surface as a download 404 much later.
      - name: Refuse an incomplete cohort
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.tag || github.ref_name }}"
          version="${raw#v}"
          missing=0
          for spec in \
            "x86_64-unknown-linux-gnu:tar.gz" \
            "aarch64-unknown-linux-gnu:tar.gz" \
            "aarch64-apple-darwin:tar.gz" \
            "x86_64-pc-windows-msvc:zip"; do
            target="${spec%%:*}"; ext="${spec##*:}"
            archive="members/vaultspec-a2a-${version}-${target}.${ext}"
            for f in "${archive}" "${archive}.sha256"; do
              if [ ! -f "$f" ]; then
                echo "::error::missing release member: $f" >&2
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l members
          echo "all four targets present with sidecars"

      - name: Upload the assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw="${{ inputs.tag || github.ref_name }}"
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh is required to upload release assets and is not on PATH" >&2
            exit 1
          fi
          gh release upload "${raw}" members/* --clobber --repo "${GITHUB_REPOSITORY}"
          echo "uploaded $(find members -type f | wc -l) assets to ${raw}"
