name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint (actionlint)
    # actionlint is the only thing that reads these files before GitHub itself
    # does. It earns a gate here for one failure class this fleet keeps paying
    # for: a `runs-on:` label that no registered runner carries. That does not
    # fail at dispatch - it QUEUES, unbounded, producing no logs and no failure,
    # which is the most expensive way this pipeline can break, because it is
    # indistinguishable from a busy fleet while it happens.
    #
    # Not hypothetical here. `bootstrap-branch.yml` targets
    # `[self-hosted, dev-runner]`, and for as long as no runner carried that
    # label every one of its historical runs was cancelled by hand rather than
    # completing. One does now, as does a runner for each of the four label sets
    # every other job in this repository asks for.
    #
    # The labels this repository is permitted to schedule onto are enumerated in
    # .github/actionlint.yaml, which actionlint reads automatically. Adding a new
    # runner label means declaring it there, which is the point: the declaration
    # is what makes a typo detectable.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11

  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `false` on purpose, and it is not a de-optimisation. These runners
          # are self-hosted and persistent, and each one pins UV_CACHE_DIR at a
          # cache shared by every runner on its host - so the cache is already
          # warm before the job starts and survives after it ends. `true` adds a
          # GitHub-cache round trip on top of that, and its post step then tries
          # to upload the whole shared directory: measured on this branch, the
          # `Post Set up uv` step ran for 18 minutes and was still going when it
          # hit the job's 20-minute budget, cancelling a run whose actual work
          # had finished in 81 seconds. Every sibling repo on this fleet already
          # calls setup-uv without it.
          enable-cache: false
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      - name: Run canonical CI
        run: just ci

      - name: Run type-strict sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint type-strict

      - name: Run complexity sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint complexity

      - name: Run cyclomatic sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint cyclomatic

      - name: Run shape sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint shape

      - name: Run limits sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint limits

      - name: Run nesting sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint nesting

      - name: Run size sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint size

      - name: Run advisory production JSCPD clone detection
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just audit duplication

      # The environment synchronized above carries --extra server, which
      # installs the OTLP exporter, so no step before this one can observe a
      # base-only installation. This gate builds its own isolated default-deps
      # environment for exactly that reason.
      - name: Prove telemetry starts in a base-only installation
        run: just dev test clean-base

      - name: Build strict documentation
        run: just dev build docs

  desktop-certification:
    name: Desktop service tests (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
          - target: aarch64-unknown-linux-gnu
            runner: [self-hosted, ARM64, Linux]
          - target: x86_64-pc-windows-msvc
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `false` on purpose, and it is not a de-optimisation. These runners
          # are self-hosted and persistent, and each one pins UV_CACHE_DIR at a
          # cache shared by every runner on its host - so the cache is already
          # warm before the job starts and survives after it ends. `true` adds a
          # GitHub-cache round trip on top of that, and its post step then tries
          # to upload the whole shared directory: measured on this branch, the
          # `Post Set up uv` step ran for 18 minutes and was still going when it
          # hit the job's 20-minute budget, cancelling a run whose actual work
          # had finished in 81 seconds. Every sibling repo on this fleet already
          # calls setup-uv without it.
          enable-cache: false
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      - name: Run desktop service gates
        shell: bash
        run: |
          just dev test service src/vaultspec_a2a/desktop_tests/

  provider-prerequisites:
    name: Provider prerequisite gates
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `false` on purpose, and it is not a de-optimisation. These runners
          # are self-hosted and persistent, and each one pins UV_CACHE_DIR at a
          # cache shared by every runner on its host - so the cache is already
          # warm before the job starts and survives after it ends. `true` adds a
          # GitHub-cache round trip on top of that, and its post step then tries
          # to upload the whole shared directory: measured on this branch, the
          # `Post Set up uv` step ran for 18 minutes and was still going when it
          # hit the job's 20-minute budget, cancelling a run whose actual work
          # had finished in 81 seconds. Every sibling repo on this fleet already
          # calls setup-uv without it.
          enable-cache: false
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      # These gates were skipif-ed on CLIs no workflow ever installed, so they
      # skipped on every CI run and had never executed there: a regression in
      # Codex session handling or the projected MCP config would have merged
      # green. Neither CLI needs a credential for the gates below.
      - name: Install the provider CLIs these gates require
        run: npm install -g @openai/codex @anthropic-ai/claude-code

      # Declares those CLIs present, so a gate that skips anyway fails this job
      # rather than vanishing from the totals.
      - name: Run provider prerequisite gates
        run: just dev test provider-gates

  compose-regression:
    name: Compose server profile regression
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `false` on purpose, and it is not a de-optimisation. These runners
          # are self-hosted and persistent, and each one pins UV_CACHE_DIR at a
          # cache shared by every runner on its host - so the cache is already
          # warm before the job starts and survives after it ends. `true` adds a
          # GitHub-cache round trip on top of that, and its post step then tries
          # to upload the whole shared directory: measured on this branch, the
          # `Post Set up uv` step ran for 18 minutes and was still going when it
          # hit the job's 20-minute budget, cancelling a run whose actual work
          # had finished in 81 seconds. Every sibling repo on this fleet already
          # calls setup-uv without it.
          enable-cache: false
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      - name: Run Compose server profile regression
        run: |
          just dev test service \
            src/vaultspec_a2a/service_tests/test_compose_profile_regression.py
