name: Full Validation

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: "Check: Workflow contract (Linux)"
    # Validate workflow syntax and the repository-owned recipe contract. Runner
    # registration and fleet topology are infrastructure concerns outside this
    # codebase's test contract.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Initialize the worktree
        run: just init

      # actionlint and the CI/justfile contract, both through the recipe.
      - name: Workflow lint and CI contract (just check-workflow)
        run: just check-workflow

  test:
    name: "Check: Full CI (Linux)"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init-full

      - name: Run canonical CI
        run: just ci

      - name: Run type-strict sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-type-strict

      - name: Run complexity sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-complexity

      - name: Run cyclomatic sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-cyclomatic

      - name: Run shape sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-shape

      - name: Run limits sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-limits

      - name: Run nesting sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-nesting

      - name: Run size sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-size

      - name: Run advisory production JSCPD clone detection
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just audit-duplication

      # The environment synchronized above carries --extra server, which
      # installs the OTLP exporter, so no step before this one can observe a
      # base-only installation. This gate builds its own isolated default-deps
      # environment for exactly that reason.
      - name: Prove telemetry starts in a base-only installation
        run: just test-clean-base

      - name: Build strict documentation
        run: just docs-build

  desktop-certification:
    name: "Test: Desktop service (${{ matrix.target }})"
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
          - target: aarch64-unknown-linux-gnu
            runner: [self-hosted, ARM64, Linux]
          - target: x86_64-pc-windows-msvc
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run desktop service gates
        shell: bash
        run: |
          just test-service-path src/vaultspec_a2a/desktop_tests/

  provider-prerequisites:
    name: "Test: Provider prerequisites (Linux)"
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init-full

      # The selected Codex and Kimi gates need installed CLIs but no credential.
      - name: Install the provider CLI these gates require
        run: |
          npm install -g @openai/codex
          uv tool install --force kimi-cli==1.49.0
          uv tool dir --bin >> "$GITHUB_PATH"

      # Declares those CLIs present, so a gate that skips anyway fails this job
      # rather than vanishing from the totals.
      - name: Run provider prerequisite gates
        run: just test-provider-gates

  compose-regression:
    name: "Test: Compose server profile (Windows)"
    needs: test
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run Compose server profile regression
        run: just test-service-path src/vaultspec_a2a/service_tests/test_compose_profile_regression.py
