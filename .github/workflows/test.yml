name: Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      - name: Run canonical CI
        run: just ci

      - name: Run type-strict sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint type-strict

      - name: Run complexity sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint complexity

      - name: Run cyclomatic sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint cyclomatic

      - name: Run shape sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint shape

      - name: Run limits sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint limits

      - name: Run nesting sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint nesting

      - name: Run size sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just lint size

      - name: Run advisory production JSCPD clone detection
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just audit duplication

      # The environment synchronized above carries --extra server, which
      # installs the OTLP exporter, so no step before this one can observe a
      # base-only installation. This gate builds its own isolated default-deps
      # environment for exactly that reason.
      - name: Prove telemetry starts in a base-only installation
        run: just dev test clean-base

      - name: Build strict documentation
        run: just dev build docs

  desktop-certification:
    name: Desktop service tests (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      - name: Run desktop service gates
        shell: bash
        run: |
          just dev test service src/vaultspec_a2a/desktop_tests/

  provider-prerequisites:
    name: Provider prerequisite gates
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      # These gates were skipif-ed on CLIs no workflow ever installed, so they
      # skipped on every CI run and had never executed there: a regression in
      # Codex session handling or the projected MCP config would have merged
      # green. Neither CLI needs a credential for the gates below.
      - name: Install the provider CLIs these gates require
        run: npm install -g @openai/codex @anthropic-ai/claude-code

      # Declares those CLIs present, so a gate that skips anyway fails this job
      # rather than vanishing from the totals.
      - name: Run provider prerequisite gates
        run: just dev test provider-gates

  compose-regression:
    name: Compose server profile regression
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize locked CI environment
        run: uv sync --locked --no-default-groups --extra server --group all

      - name: Run Compose server profile regression
        run: |
          just dev test service \
            src/vaultspec_a2a/service_tests/test_compose_profile_regression.py
