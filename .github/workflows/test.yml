name: Full Validation

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: "Check: Workflow contract (Linux)"
    # Validate workflow syntax and the repository-owned recipe contract. Runner
    # registration and fleet topology are infrastructure concerns outside this
    # codebase's test contract.
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 10
    timeout-minutes: 130
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
          cache: ''

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"

      - name: Initialize the worktree
        run: just init

      # actionlint and the CI/justfile contract, both through the recipe.
      - name: Workflow lint and CI contract (just check-workflow)
        run: just check-workflow

  test:
    name: "Check: Full CI (Linux)"
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 90
    timeout-minutes: 210
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
          cache: ''

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init-full

      - name: Expose the locked Claude CLI required by binary identity tests
        run: just deps-claude-cli

      - name: Install the proven Codex CLI required by binary identity tests
        run: just deps-codex-cli

      - name: Run canonical CI
        run: just ci

      - name: Run complexity sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-complexity

      - name: Run limits sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-limits

      - name: Run size sentinel
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just check-size

      # The environment synchronized above carries --extra otlp, which
      # installs the OTLP exporter, so no step before this one can observe a
      # base-only installation. This gate builds its own isolated default-deps
      # environment for exactly that reason.
      - name: Prove telemetry starts in a base-only installation
        run: just test-clean-base

      - name: Build strict documentation
        run: just docs-build

  desktop-certification:
    name: "Test: Desktop service (${{ matrix.target }})"
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
          - target: aarch64-unknown-linux-gnu
            runner: [self-hosted, ARM64, Linux]
          - target: x86_64-pc-windows-msvc
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    env:
      CI_EXEC_BUDGET_MINUTES: 45
    timeout-minutes: 165
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run desktop service gates
        shell: bash
        run: |
          just test-service-path src/vaultspec_a2a/desktop_tests/

  provider-prerequisites:
    name: "Test: Provider prerequisites (Linux)"
    needs: test
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 20
    timeout-minutes: 140
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init-full

      # The selected Codex and Kimi gates need installed CLIs but no credential.
      - name: Install the provider CLI these gates require
        run: |
          npm install -g @openai/codex@0.160.0
          test "$(codex --version)" = "codex-cli 0.160.0"
          uv tool install --force kimi-cli==1.49.0
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Verify pinned Codex registry signatures
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-signature-audit" --save-exact --ignore-scripts --no-fund @openai/codex@0.160.0
          npm audit signatures --prefix "$RUNNER_TEMP/codex-signature-audit"

      # Declares those CLIs present, so a gate that skips anyway fails this job
      # rather than vanishing from the totals.
      - name: Run provider prerequisite gates
        run: just test-provider-gates

  native-integration:
    name: "Test: Native services with development fixtures (Linux)"
    needs: test
    runs-on: [self-hosted, Linux, X64, docker-rootless]
    timeout-minutes: 121
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: false
          enable-cache: false
          version: "0.11.29"
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Initialize the worktree
        run: just init
      - name: Prepare rootless Docker fixture tooling
        run: just deps-docker-ci
      - name: Certify native lifecycle, cancellation and traces
        run: just test-native-integration
