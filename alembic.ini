[alembic]
# Checkout-relative, and deliberately so: this file exists for the bare `alembic`
# CLI run from a source tree. Nothing at runtime reads it — the service, the
# desktop entry point and `python -m vaultspec_a2a.database.admin` all build
# their configuration through database.migrate, which resolves the revision
# scripts from installed package data instead.
script_location = src/vaultspec_a2a/database/migrations
# Deliberately empty. env.py READS this value rather than overriding it, so a
# real one here would send a bare `alembic upgrade head` at whatever database
# that string names — and the previous checkout-relative value named one that
# does not exist, because the store anchors to the A2A home rather than to the
# working directory. Migrating a phantom file and reporting success is worse
# than refusing, so the URL must be supplied explicitly:
#   alembic -x ... -c alembic.ini upgrade head   (with sqlalchemy.url set)
# or, preferably, use the administrative entry point, which resolves the
# configured store for you:
#   python -m vaultspec_a2a.database.admin migrate
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
