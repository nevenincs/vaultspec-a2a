[project]
name = "vaultspec-a2a"
version = "0.2.0"
description = "Headless A2A agent orchestration for the vaultspec workflow (gateway + worker, engine-facing six-member whitelist)"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
  "anyio>=4.9.0",
  "aiosqlite>=0.20.0",
  # Imported directly by this package rather than reached through pydantic and
  # langchain-core, which is where both used to arrive from. A transitive
  # dependency is one an upstream may drop in a patch release without any
  # obligation to us, so what src/ imports, src/ declares.
  "annotated-types>=0.8.0",
  "typing-extensions>=4.16.0",
  "fastapi>=0.133.1",
  "httpx>=0.28.1",
  "langchain-core>=1.2.16",
  "langchain-openai>=1.1.10",
  "langgraph>=0.2.16",
  "langgraph-checkpoint-sqlite>=2.0.0",
  # 2.x only: the server targets the `mcp.server.mcpserver` surface that replaced
  # `mcp.server.fastmcp`, so a 1.x resolve fails at import. The upper bound keeps
  # the next major from repeating that break on an unpinned install.
  "mcp>=2,<3",
  "opentelemetry-sdk>=1.39.1",
  "opentelemetry-instrumentation-fastapi>=0.60b0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "pyyaml>=6.0.2",
  "rich>=14.3.2",
  "sqlalchemy[asyncio]>=2.0.40",
  "starlette>=0.52.1",
  "uvicorn>=0.41.0",
  "websockets>=16.0",
  "alembic>=1.15.1",
  "click>=8.1",
  "langsmith>=0.3.1",
  "torch>=2.13.0",
  "vaultspec-rag[mcp]",
]

[project.optional-dependencies]
server = [
  "asyncpg>=0.30.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
  "psycopg[binary,pool]>=3.2.9",
]
rag = [
  "torch>=2.4",
  "vaultspec-rag[mcp]>=0.3.8",
]

[project.scripts]
vaultspec-a2a = "vaultspec_a2a.cli.main:main"

# The resource-aware execution plugin loads through the pytest11 entry point,
# NOT through addopts: a lane that replaces addopts wholesale (the toolchain's
# service target does, via --override-ini) must still run under the leases,
# groups, and admission the plugin provides. An addopts channel is strippable;
# this one is not.
[project.entry-points.pytest11]
vaultspec-a2a-testing = "vaultspec_a2a.testing.plugin"

[dependency-groups]
docs = [
  "sphinx>=8.2",
]
tooling = [
  "actionlint-py==1.7.12.24",
  # Security posture over production code. Advisory: it reports this project's
  # deliberate subprocess and dynamic-import design alongside anything real.
  "bandit>=1.9.4",
  # Strict-mode type checking, one tier above `ty`. `ty` is the fast gate that
  # runs on every commit; basedpyright is the strict pass that catches what a
  # fast checker deliberately does not (implicit overrides, uninitialized
  # instance state, unnecessary ignores, private-import reach-through).
  "basedpyright>=1.39",
  # Cognitive complexity - how much state a reader must hold to follow a
  # function, as distinct from the number of paths through it that radon and
  # ruff's C90 measure. Implements the Sonar specification; configured from
  # [tool.complexipy] below at that specification's own limit of 15.
  "complexipy>=6.2",
  "deptry>=0.23.0",
  "identify>=2.0.0",
  # Docstring coverage over the public surface. Advisory.
  "interrogate>=1.7.0",
  "jsonschema>=4.26.0",
  "nodeenv>=1.0.0",
  "packaging>=25.0",
  "prek>=0.3.2",
  # Module length and the class-shape design limits ruff has no rule for
  # (C0302, R0902, R0904, R0916). Everything else pylint would report is
  # already covered by ruff and stays disabled in [tool.pylint].
  "pylint>=4.0",
  # The provider catalog tests inspect real processes to prove a launched
  # provider is the one they think it is. That arrived transitively; a test
  # importing it directly declares it directly.
  "psutil>=7.2.2",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.4.0",
  # Multi-process test distribution, admitted ONLY under --dist=loadgroup with
  # groups computed from declared test resources (src/vaultspec_a2a/testing);
  # the plugin there rejects every other dist mode, so xdist's blind placement
  # modes are unreachable.
  "pytest-xdist>=3.8",
  # Cyclomatic complexity and the Maintainability Index, used as a LIBRARY by
  # dev/health/report.py - the numbers are radon's own, with no command output
  # parsed in between, so the gate and the health report cannot disagree.
  #
  # The usual CLI gate built on radon, `xenon`, is deliberately absent: it reads
  # pyproject.toml through configparser, which reads this project's legitimate
  # `log_cli_format` ("%(asctime)s ...") as broken interpolation and crashes
  # before scanning anything. `dev.health --gate` enforces the same ceiling.
  "radon>=6.0.1",
  "ruff>=0.15.2",
  "tenacity>=9.0.0",
  "tomlkit>=0.15.0",
  "ty>=0.0.15",
  "vaultspec-core>=0.1.48,<0.2",
  # Dead-code detection. Advisory: it infers reachability it cannot always see,
  # so a finding is a lead to confirm rather than a verdict.
  "vulture>=2.16",
  "websockets>=16.0",
  "zstandard>=0.25.0",
]
dev = [
  { include-group = "tooling" },
]
# The frozen-binary build closure: PyInstaller itself plus vaultspec-core,
# which the binary dispatches via its run-module verb (never a static import,
# so the spec collects it explicitly). Installed by scripts/build_binary.py's
# caller (the dashboard release pipeline), not by ordinary development.
freeze = [
  "pyinstaller>=6.11",
  "vaultspec-core>=0.1.48,<0.2",
]
all = [
  { include-group = "docs" },
  { include-group = "tooling" },
]

[tool.uv]
default-groups = []

[tool.uv.sources]
# uv-only project metadata. `tool.uv.sources` is NOT emitted into the wheel's
# Requires-Dist, and PEP 508 has no way to express an index, so this override
# reaches uv-managed resolution ONLY. A consumer running `pip install
# vaultspec-a2a[rag]` against the built wheel resolves torch from the default
# index and gets whatever CUDA build PyPI serves, not cu130. Anything that needs
# the pinned CUDA build must therefore resolve through the uv-managed lock
# rather than wheel metadata; do not restate this override as a property of the
# published package.
torch = [
    { index = "pytorch-cu130", extra = "rag", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.vaultspec-rag.mcp-extra]
location = "[project].dependencies"
managed = "vaultspec-rag[mcp]"
added = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultspec_a2a"]
# Hatch packages every non-excluded file below the declared package root. A
# dirty build can therefore capture untracked files; release verification must
# build from a clean commit archive rather than the working tree.
#
# Production package data retained by this denylist:
#   - database/migrations/**  — Alembic scripts, env.py, and script.py.mako
#     resolved from installed package resources (see database/migrate.py).
#   - team/presets/{agents,teams}/**  — product agent and team presets; mock and
#     deterministic certification variants remain available only in source and
#     Compose certification environments.
#   - context/presets/**  — bundled authoring rule corpus.
#
# Excluded: all test harnesses and certification-only preset assets. Source-run
# and Compose certification still use these files from the checkout.
exclude = [
  "**/tests",
  "**/tests/**",
  "src/vaultspec_a2a/conftest.py",
  "src/vaultspec_a2a/desktop_tests",
  "src/vaultspec_a2a/desktop_tests/**",
  "src/vaultspec_a2a/service_tests",
  "src/vaultspec_a2a/service_tests/**",
  "src/vaultspec_a2a/acceptance",
  "src/vaultspec_a2a/acceptance/**",
  "src/vaultspec_a2a/team/presets/mock",
  "src/vaultspec_a2a/team/presets/mock/**",
  "src/vaultspec_a2a/team/presets/agents/mock-*.toml",
  "src/vaultspec_a2a/team/presets/agents/*-mock.toml",
  "src/vaultspec_a2a/team/presets/teams/mock-*.toml",
  "src/vaultspec_a2a/team/presets/teams/*-mock.toml",
  "src/vaultspec_a2a/team/presets/teams/vaultspec-adr-research-deterministic.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas/desktop-capsule-manifest.json" = "vaultspec_a2a/desktop/schemas/desktop-capsule-manifest.json"

[tool.pytest.ini_options]
# --capture=sys: avoids pytest's fd-level dup2 which crashes silently under
# Git Bash / MinTTY (the _windowsconsoleio_workaround path). sys-level capture
# replaces sys.stdout/stderr in memory only — no CloseHandle, no silent death.
# The resource-aware execution plugin (declaration-derived xdist groups,
# machine-global leases, registry-backed endpoints, session admission) loads
# through its pytest11 entry point, so an addopts override cannot strip it.
addopts = ["--durations=10", "--showlocals", "-ra", "--capture=sys", "-m", "not service"]
# log_cli is opt-in, not a default: every module logger streaming live into
# every run buries the pass/fail signal in noise, and failing-test log capture
# (pytest's own default) already surfaces diagnostics without it. Opt in with
# `-o log_cli=true` (or add `-o log_cli_level=DEBUG` to raise the level) when
# debugging a specific run; the format below still applies once enabled.
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
norecursedirs = [".venv", "knowledge", "node_modules"]
strict_xfail = true
# OTEL_SDK_DISABLED=true is set in the root conftest.py (collection-time)
# to silence gRPC exporter noise.  Service tests override this via CI env.
testpaths = ["src/vaultspec_a2a"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = "300"
markers = [
  "core: marks Layer 1 + Layer 1.5 tests — pure domain, zero infrastructure (run with '-m core')",
  "middleware: marks middleware-layer tests — protocol adapters + infra services, no orchestration deps (run with '-m middleware')",
  "unit: marks pure unit tests across all layers — no I/O, no database, no HTTP (run with '-m unit')",
  "service: marks Layer 3 certification tests — most require Docker compose services, though some members are engine-free and run fully in-process. Run with pytest -m service.",
  "resource(key, shared=False): declares a contended real resource this test uses; drives scheduling groups, machine-global leases, and timeout backstops (vaultspec_a2a.testing).",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific rules
  "N",   # pep8-naming
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["ARG"]
"**/tests/**/*.py" = ["ARG"]
# FastAPI endpoints use Depends() in function defaults
"src/vaultspec_a2a/api/dependencies.py" = ["B008"]
"src/vaultspec_a2a/api/routes/*.py" = ["B008"]
"src/vaultspec_a2a/api/internal.py" = ["B008"]
"src/vaultspec_a2a/worker/app.py" = ["B008"]

# INDUSTRY DEFAULTS, NOT CALIBRATED TO THIS TREE. The rules these two tables
# configure are deliberately absent from `select` above, so they do not fire on
# the everyday `just dev lint python` gate. They are selected explicitly by
# `just dev lint limits` and `just dev lint nesting`, which are the burndown
# dimensions: keeping them out of the base gate is what stops an unfinished
# burndown from hiding a real style or correctness regression behind it.
#
# Every number below is the tool's own published default. Nothing here was
# raised to accommodate the current worst offender - `just dev health` reports
# the distance, and the number to move is the code.
[tool.ruff.lint.mccabe]
# McCabe's own recommendation, and the flake8, ruff, and SonarQube default.
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5       # PLR0913 default
max-branches = 12  # PLR0912 default
max-returns = 6    # PLR0911 default
max-statements = 50 # PLR0915 default

[tool.ruff.lint.isort]
known-first-party = ["vaultspec_a2a"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at class-build time, so imports used only
# as model field types are runtime-required, not type-checking-only. Teaching
# TCH this keeps such imports at module scope instead of a TYPE_CHECKING block.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.deptry]
extend_exclude = ["knowledge"]
known_first_party = ["vaultspec_a2a"]

[tool.deptry.package_module_name_map]
opentelemetry-sdk = "opentelemetry"
opentelemetry-exporter-otlp-proto-grpc = "opentelemetry"
opentelemetry-instrumentation-fastapi = "opentelemetry"
pytest-asyncio = "pytest_asyncio"
torch = "torch"

[tool.deptry.per_rule_ignores]
# DEP002: packages invoked as CLI tools or loaded via URL scheme (not direct Python imports)
DEP002 = [
  "actionlint-py",
  "ruff",
  "ty",
  "prek",
  "identify",
  "nodeenv",
  "pytest-timeout",
  "pytest-cov",
  "deptry",
  "vaultspec-core",
  # aiosqlite is loaded as the SQLAlchemy async driver via the URL scheme
  # "sqlite+aiosqlite://..." — never imported directly.
  "aiosqlite",
  # Uvicorn loads websockets as its protocol backend.
  "websockets",
  # The server profile loads PostgreSQL drivers through SQLAlchemy URLs.
  "asyncpg",
  "psycopg",
  # The RAG profile provisions its runtime and MCP service out of process.
  "torch",
  "vaultspec-rag",
  # langsmith is the LangGraph/LangChain tracing backend, activated at runtime
  # via LANGCHAIN_TRACING_V2 / LANGSMITH_* env and consumed by the langgraph
  # runtime — never imported directly.
  "langsmith",
]
# DEP004: tests, documentation extensions, and the dev/ tooling harness import
# their owning development groups. The harness is not shipped - the wheel packs
# only `src/vaultspec_a2a` - so a development-group import there is correct by
# construction rather than an exception being carved out.
DEP004 = [
  "jsonschema",
  "packaging",
  # The provider catalog tests inspect real processes; psutil is a tooling-group
  # package a test imports, exactly like pytest below.
  "psutil",
  "pytest",
  "pytest_asyncio",
  # dev/health/report.py uses radon's library API to measure this tree.
  "radon",
  "sphinx",
  "tenacity",
  "tomlkit",
  # The grounding-parity test drives the real vaultspec-core CLI, which the
  # `freeze` group owns because the frozen binary dispatches it. Importing it
  # from a test is the same construction as every entry above: the wheel packs
  # only `src/vaultspec_a2a`, so nothing shipped depends on it.
  "vaultspec_core",
]

[tool.ty.environment]
python-version = "3.13"
root = [".", "src"]

[tool.ty.src]

# ── Strict type checking ─────────────────────────────────────────────────────
# `ty` above is the FAST gate: it runs on every commit through prek and in
# `just dev lint all`. basedpyright is the STRICT pass behind it, run by
# `just dev lint type-strict`. Two checkers rather than one is deliberate -
# a fast checker earns its place by being fast, which means it declines to
# prove the expensive things, and those are exactly what the strict pass adds.
[tool.basedpyright]
include = ["src", "dev"]
exclude = ["**/__pycache__", "**/node_modules", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

# Individual rules enabled beyond `strict`, curated rather than a blanket
# `typeCheckingMode = "all"`, which reports mostly noise on any real tree.
# An override that drops `@override` loses its link to the base method
# silently: rename the base method and the override becomes a dead sibling
# instead of a type error.
reportImplicitOverride = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
# A symbol imported into a module but not re-exported is that module's private
# implementation detail; a second module reaching past it is a trust-boundary
# violation, and this is the non-underscore half of that boundary.
reportPrivateLocalImportUsage = "error"

executionEnvironments = [
  { root = "src/vaultspec_a2a/providers/tests", reportPrivateUsage = false },
  { root = "src/vaultspec_a2a/service_tests", reportPrivateUsage = false },
]

# ── Cognitive complexity ─────────────────────────────────────────────────────
# The Sonar cognitive-complexity specification's own limit. This measures how
# much state a reader must hold to follow a function, which is a different
# question from how many paths run through it (ruff's C90 and dev.health).
[tool.complexipy]
max-complexity = 15

# ── Module length and class design ───────────────────────────────────────────
# pylint runs ONLY for the four limits ruff has no rule for. Everything else it
# would report is already covered by ruff, so enabling more would mean two
# tools disagreeing about the same finding.
[tool.pylint.main]
py-version = "3.13"
ignore-paths = ["^.*[\\\\/]tests[\\\\/].*$", "^.*[\\\\/]service_tests[\\\\/].*$"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "too-many-lines",           # C0302 - module length
  "too-many-instance-attributes", # R0902
  "too-many-public-methods",  # R0904
  "too-many-boolean-expressions", # R0916
]

[tool.pylint.format]
# pylint's own default, and this repository's stated module-size mandate.
max-module-lines = 1000

[tool.pylint.design]
max-attributes = 7      # R0902 default
max-public-methods = 20 # R0904 default
max-bool-expr = 5       # R0916 default

# ── Dead code ────────────────────────────────────────────────────────────────
# Advisory. vulture infers reachability it cannot always see - a name reached
# only through a registry, a plugin lookup, or a framework callback reads as
# dead - so a finding here is a lead to confirm, never a verdict.
[tool.vulture]
paths = ["src/vaultspec_a2a"]
exclude = ["*/tests/*", "*/service_tests/*"]
# The tool's own default. Raising it to 80 would hide the whole class of
# genuinely-unused imports and variables this scan exists to surface.
min_confidence = 60
sort_by_size = true

# ── Security ─────────────────────────────────────────────────────────────────
# Advisory. This project spawns provider CLIs and loads drivers by URL scheme
# on purpose, so the scan reports that deliberate design alongside anything
# real.
[tool.bandit]
# Test-tier exclusion is NOT set here. `exclude_dirs` is silently ignored when
# bandit runs with `-r`, so the setting looked correct while the scan kept
# covering all 105k lines. The exclusion lives on the command line in
# `dev/toolchain.py` (`BANDIT_EXCLUDES`), which does take effect.
skips = [
  # B101: pytest and the internal invariant checks use `assert` by design.
  "B101",
]

# ── Docstring coverage ───────────────────────────────────────────────────────
# Advisory. 80% is the conventional floor for a public-surface docstring gate.
[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
ignore-module = false
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
exclude = ["src/vaultspec_a2a/tests", "src/vaultspec_a2a/service_tests"]
omit-covered-files = true
