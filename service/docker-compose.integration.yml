# Development and test fixtures for native gateway and worker processes.
# Usage: just stack-integration-up
# No application services or production dependencies are defined here.

services:
  vidaimock:
    build:
      context: ..
      dockerfile: service/docker/vidaimock.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${VIDAIMOCK_PORT:-8100}:8100'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket, sys; sock = socket.socket(); sock.settimeout(1); sys.exit(0 if sock.connect_ex(('127.0.0.1', 8100)) == 0 else 1)",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.16.0
    restart: unless-stopped
    ports:
      # Host certification needs ingestion and querying, but only locally.
      - '127.0.0.1:${JAEGER_OTLP_PORT:-4317}:4317'
      - '127.0.0.1:${JAEGER_UI_PORT:-16686}:16686'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:13133/status']
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
