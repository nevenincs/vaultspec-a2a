# Development and test fixtures for native gateway and worker processes.
# Usage: just stack-integration-up
# No application services or production dependencies are defined here.

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.16.0
    restart: unless-stopped
    ports:
      # Host certification needs ingestion and querying, but only locally.
      - '127.0.0.1:${JAEGER_OTLP_PORT:-4317}:4317'
      - '127.0.0.1:${JAEGER_UI_PORT:-16686}:16686'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:13133/status']
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
