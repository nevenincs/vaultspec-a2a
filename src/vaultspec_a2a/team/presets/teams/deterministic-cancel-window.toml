[team]
id           = "deterministic-cancel-window"
display_name = "Deterministic Cancellation Window"
description  = "ProviderFactory scenario for cancellation while model generation is in flight."

[team.defaults]
provider   = "deterministic"
capability = "mid"

[team.topology]
type  = "pipeline"
order = ["deterministic-cancel-window"]

[team.permissions]
auto_approve = false

[team.persona]
directive = "Run the in-process deterministic cancellation-window scenario."

[team.graph]
step_timeout_seconds = 60
recursion_limit      = 10

[[team.workers]]
agent_id = "deterministic-cancel-window"

