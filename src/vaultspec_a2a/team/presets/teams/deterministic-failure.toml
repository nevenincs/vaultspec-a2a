[team]
id           = "deterministic-failure"
display_name = "Deterministic Failure"
description  = "ProviderFactory scenario for a fixed provider failure."

[team.defaults]
provider   = "deterministic"
capability = "mid"

[team.topology]
type  = "pipeline"
order = ["deterministic-failure"]

[team.permissions]
auto_approve = false

[team.persona]
directive = "Run the in-process deterministic failure scenario."

[team.graph]
step_timeout_seconds = 60
recursion_limit      = 10

[[team.workers]]
agent_id = "deterministic-failure"

